name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch base ref (for diff)
        run: git fetch --no-tags --depth=1 origin "+${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}" || true

      - name: Verify skill version-bump policy
        run: pnpm verify:skills:versions

      - name: Verify compliance freshness (changed skills)
        run: pnpm verify:skills:freshness

      - name: Generate skills
        run: pnpm generate:skills

      - name: Verify generated output is committed
        run: pnpm verify:skills:drift

      - name: Lint
        run: pnpm --filter @agent-skills/web lint

      - name: React rules doctor
        run: pnpm --filter @agent-skills/web doctor:react

      - name: Typecheck schema
        run: pnpm --filter @agent-skills/skill-schema typecheck

      - name: Typecheck web
        run: pnpm --filter @agent-skills/web typecheck

      - name: Unit tests
        run: pnpm --filter @agent-skills/web test

      - name: Build
        run: pnpm --filter @agent-skills/web build
