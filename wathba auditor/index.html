<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wathba Skills · Agent skill pack generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root {
  /* Warm editorial light */
  --bg: #F7F2EA;
  --surface: #FFFDF8;
  --surface-variant: #EFE7DC;
  --surface-sunken: #EFE7DC;
  --secondary: #EADFD1;
  --border: #DCCFB8;
  --border-strong: #C9B99A;
  --fg: #1F1A16;
  --fg-muted: #6F6257;
  --fg-soft: #8E8070;
  --primary: #8F4B24;
  --primary-hover: #7a3f1d;
  --primary-soft: #E8D6C4;
  --primary-fg: #FFFDF8;
  --destructive: #C24D36;
  --success: #4F7A52;
  --warning: #A56A2A;
  --info: #4A6B85;

  --shadow-sm: 0 1px 2px rgba(25, 18, 12, 0.04);
  --shadow: 0 6px 24px rgba(25, 18, 12, 0.06);
  --shadow-lg: 0 12px 40px rgba(25, 18, 12, 0.1);

  --radius-sm: 8px;
  --radius: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;

  --serif: "Source Serif 4", ui-serif, Georgia, serif;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

  --step: 200ms cubic-bezier(.2,.7,.2,1);
}
:root[data-theme="dark"] {
  --bg: #1A1410;
  --surface: #221B15;
  --surface-variant: #2B221B;
  --surface-sunken: #15100C;
  --secondary: #2F261E;
  --border: #3A2F24;
  --border-strong: #554432;
  --fg: #F3EADB;
  --fg-muted: #B5A691;
  --fg-soft: #8E8070;
  --primary: #D68A5D;
  --primary-hover: #E09968;
  --primary-soft: #3A281C;
  --primary-fg: #1A1410;
  --shadow: 0 6px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
}
:root[data-primary="ink"] {
  --primary: #2E4A6B;
  --primary-hover: #243b57;
  --primary-soft: #D4DDE7;
}
:root[data-primary="olive"] {
  --primary: #5C6A36;
  --primary-hover: #4a562b;
  --primary-soft: #DFE3CE;
}
:root[data-primary="slate"] {
  --primary: #3A3A3A;
  --primary-hover: #2a2a2a;
  --primary-soft: #D9D5CE;
}
:root[data-theme="dark"][data-primary="ink"] { --primary: #6B8AA8; --primary-hover: #7C9AB8; --primary-soft: #1F2F42; }
:root[data-theme="dark"][data-primary="olive"] { --primary: #A0B06A; --primary-hover: #B0C07A; --primary-soft: #2A3120; }
:root[data-theme="dark"][data-primary="slate"] { --primary: #B8B4AC; --primary-hover: #C8C4BC; --primary-soft: #2A2A2A; }

/* ============ BASE ============ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
}
[dir="rtl"] body { font-family: "IBM Plex Sans Arabic", var(--sans); }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3 { font-family: "Amiri", "IBM Plex Sans Arabic", var(--serif); font-weight: 700; }
p { margin: 0; text-wrap: pretty; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font-family: inherit; font-size: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--primary-soft); color: var(--fg); }

/* ============ LAYOUT ============ */
.app-shell { min-height: 100vh; display: flex; flex-direction: column; }
.container { width: 100%; max-width: 1200px; margin-inline: auto; padding-inline: 32px; }
.container-narrow { max-width: 820px; margin-inline: auto; padding-inline: 32px; }
@media (max-width: 720px) {
  .container, .container-narrow { padding-inline: 20px; }
}

/* ============ NAV ============ */
.nav {
  border-bottom: 1px solid var(--border);
  background: color-mix(in oklab, var(--bg) 80%, transparent);
  backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 40;
}
.nav-inner { display: flex; align-items: center; gap: 28px; padding-block: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 18px; font-weight: 600; letter-spacing: -0.01em; color: var(--fg); }
.brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--primary); display: grid; place-items: center; color: var(--primary-fg); font-family: var(--serif); font-weight: 600; font-style: italic; }
.nav-links { display: flex; gap: 4px; margin-inline-start: auto; align-items: center; }
.nav-link { padding: 8px 12px; border-radius: 8px; color: var(--fg-muted); font-size: 14px; font-weight: 500; }
.nav-link:hover { background: var(--surface-variant); color: var(--fg); text-decoration: none; }
.nav-link.active { color: var(--fg); background: var(--surface-variant); }

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500;
  border: 1px solid transparent; transition: all var(--step); white-space: nowrap;
  line-height: 1;
}
.btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); text-decoration: none; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--surface); color: var(--fg); border-color: var(--border); }
.btn-secondary:hover { background: var(--surface-variant); text-decoration: none; }
.btn-ghost { color: var(--fg-muted); background: transparent; }
.btn-ghost:hover { background: var(--surface-variant); color: var(--fg); text-decoration: none; }
.btn-lg { padding: 14px 24px; font-size: 15px; border-radius: 12px; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn-icon { padding: 8px; width: 36px; height: 36px; justify-content: center; }

/* ============ CARDS ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  transition: all var(--step);
}
.card-hover:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
.card-sunken { background: var(--surface-sunken); }

/* ============ BADGES ============ */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 500;
  line-height: 1.4;
  background: var(--secondary); color: var(--fg-muted);
  border: 1px solid transparent;
}
.badge-primary { background: var(--primary-soft); color: var(--primary); }
.badge-success { background: color-mix(in oklab, var(--success) 18%, transparent); color: var(--success); }
.badge-warning { background: color-mix(in oklab, var(--warning) 18%, transparent); color: var(--warning); }
.badge-muted { background: var(--surface-variant); color: var(--fg-muted); }
.badge-outline { background: transparent; border-color: var(--border); color: var(--fg-muted); }
.badge-dot::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block;
}

/* ============ FORM ============ */
.label { display: block; font-size: 13px; font-weight: 500; color: var(--fg); margin-bottom: 6px; }
.hint { font-size: 13px; color: var(--fg-muted); margin-top: 6px; }
.input, .textarea, .select-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--fg);
  transition: border-color var(--step), box-shadow var(--step);
  font-size: 14px;
}
.input:focus, .textarea:focus, .select-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}

/* Radio cards */
.radio-group { display: grid; gap: 10px; }
.radio-card {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); cursor: pointer; transition: all var(--step);
  text-align: start;
}
.radio-card:hover { border-color: var(--border-strong); }
.radio-card.selected { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 1px var(--primary) inset; }
.radio-card.selected .radio-card-dot { border-color: var(--primary); }
.radio-card.selected .radio-card-dot::after { transform: scale(1); }
.radio-card-dot {
  width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border-strong);
  flex-shrink: 0; margin-top: 2px; position: relative; transition: border-color var(--step);
}
.radio-card-dot::after {
  content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--primary);
  transform: scale(0); transition: transform var(--step);
}
.radio-card-body { flex: 1; min-width: 0; }
.radio-card-title { font-size: 14px; font-weight: 500; color: var(--fg); }
.radio-card-desc { font-size: 13px; color: var(--fg-muted); margin-top: 3px; }

/* Checkbox */
.check-card {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); cursor: pointer; transition: all var(--step);
  text-align: start;
}
.check-card:hover { border-color: var(--border-strong); }
.check-card.selected { border-color: var(--primary); background: var(--primary-soft); }
.check-box {
  width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-strong);
  flex-shrink: 0; margin-top: 2px; display: grid; place-items: center;
  transition: all var(--step);
}
.check-card.selected .check-box { background: var(--primary); border-color: var(--primary); }
.check-card.selected .check-box svg { opacity: 1; }
.check-box svg { width: 12px; height: 12px; color: var(--primary-fg); opacity: 0; }

/* Toggle */
.toggle {
  position: relative; width: 36px; height: 20px; border-radius: 999px;
  background: var(--border-strong); transition: background var(--step);
  flex-shrink: 0;
}
.toggle-thumb {
  position: absolute; top: 2px; inset-inline-start: 2px;
  width: 16px; height: 16px; border-radius: 50%; background: white;
  transition: inset-inline-start var(--step);
}
.toggle.on { background: var(--primary); }
.toggle.on .toggle-thumb { inset-inline-start: 18px; }

/* ============ STEPPER ============ */
.stepper { display: flex; align-items: center; gap: 8px; }
.step-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px 6px 6px;
  padding-inline: 6px 14px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 13px; color: var(--fg-muted);
}
.step-pill.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.step-pill.done { background: var(--surface); color: var(--fg); border-color: var(--border-strong); }
.step-num {
  width: 22px; height: 22px; border-radius: 50%; background: var(--surface-variant);
  display: grid; place-items: center; font-family: var(--serif); font-weight: 500; font-size: 12px;
  color: var(--fg-muted);
}
.step-pill.active .step-num { background: rgba(255,255,255,0.2); color: var(--primary-fg); }
.step-pill.done .step-num { background: var(--success); color: white; }
.step-connector { width: 18px; height: 1px; background: var(--border); }

/* ============ MISC ============ */
.eyebrow {
  font-family: var(--sans);
  font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--primary);
}
[dir="rtl"] .eyebrow { font-family: "IBM Plex Sans Arabic"; letter-spacing: 0; }

.divider { height: 1px; background: var(--border); border: 0; margin: 0; }

.meta-row { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; color: var(--fg-muted); font-size: 13px; }
.meta-row strong { color: var(--fg); font-weight: 500; }

/* Disclosure */
.disclosure summary {
  list-style: none;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--fg-muted); font-size: 13px;
  padding: 4px 0;
  user-select: none;
}
.disclosure summary::-webkit-details-marker { display: none; }
.disclosure summary:hover { color: var(--fg); }
.disclosure-caret { transition: transform var(--step); }
.disclosure[open] .disclosure-caret { transform: rotate(90deg); }
[dir="rtl"] .disclosure-caret { transform: rotate(180deg); }
[dir="rtl"] .disclosure[open] .disclosure-caret { transform: rotate(90deg); }
.disclosure-body {
  margin-top: 10px;
  padding: 14px 16px;
  background: var(--surface-variant);
  border-radius: 10px;
  font-size: 13.5px;
  color: var(--fg-muted);
  line-height: 1.6;
  border-inline-start: 2px solid var(--primary-soft);
}

/* Code */
.code-block {
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 20px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  color: var(--fg);
  overflow: auto;
  white-space: pre-wrap;
  direction: ltr; text-align: left;
}
.code-inline { font-family: var(--mono); font-size: 0.92em; background: var(--surface-variant); padding: 1px 6px; border-radius: 4px; color: var(--fg); direction: ltr; display: inline-block; }

/* Tree */
.tree { font-family: var(--mono); font-size: 13px; line-height: 1.8; color: var(--fg); direction: ltr; text-align: left; }
.tree-dir { color: var(--primary); }
.tree-comment { color: var(--fg-muted); }

/* Inline notice */
.notice {
  display: flex; gap: 12px; padding: 14px 16px;
  background: color-mix(in oklab, var(--warning) 8%, var(--surface));
  border: 1px solid color-mix(in oklab, var(--warning) 30%, var(--border));
  border-radius: 10px;
  font-size: 13.5px;
  color: var(--fg);
  border-inline-start: 3px solid var(--warning);
}
.notice-icon { color: var(--warning); flex-shrink: 0; }
.notice-info {
  background: color-mix(in oklab, var(--info) 8%, var(--surface));
  border-color: color-mix(in oklab, var(--info) 30%, var(--border));
  border-inline-start-color: var(--info);
}
.notice-info .notice-icon { color: var(--info); }

/* Tabs */
.tabs { display: flex; gap: 2px; padding: 4px; background: var(--surface-variant); border-radius: 10px; }
.tab {
  padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
  color: var(--fg-muted); transition: all var(--step);
}
.tab:hover { color: var(--fg); }
.tab.active { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }

/* Recommended strip */
.rec-strip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase;
  background: var(--primary); color: var(--primary-fg);
}
[dir="rtl"] .rec-strip { letter-spacing: 0; text-transform: none; font-size: 12px; }

/* Footer */
.footer { border-top: 1px solid var(--border); padding: 40px 0 60px; color: var(--fg-muted); font-size: 13px; margin-top: 80px; }
.footer-inner { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 20px; }

/* Tweaks panel */
.tweaks {
  position: fixed;
  bottom: 20px; inset-inline-end: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 280px;
  z-index: 100;
  overflow: hidden;
}
.tweaks.collapsed { width: auto; }
.tweaks-header {
  padding: 12px 14px;
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 500;
  border-bottom: 1px solid var(--border);
  background: var(--surface-variant);
}
.tweaks-body { padding: 16px; display: grid; gap: 16px; }
.tweaks-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tweaks-row-label { font-size: 13px; color: var(--fg-muted); }
.swatch-row { display: flex; gap: 6px; }
.swatch {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--border); cursor: pointer;
  transition: transform var(--step);
}
.swatch:hover { transform: scale(1.1); }
.swatch.active { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }

.lang-toggle, .theme-toggle {
  display: inline-flex; background: var(--surface-variant); border-radius: 8px; padding: 2px;
}
.lang-toggle button, .theme-toggle button {
  padding: 4px 10px; border-radius: 6px; font-size: 12px; color: var(--fg-muted); font-weight: 500;
}
.lang-toggle button.active, .theme-toggle button.active { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }

/* Hero */
.hero-grid {
  padding-block: 80px 60px;
  display: grid; grid-template-columns: 1.1fr 1fr; gap: 60px;
  align-items: center;
}
@media (max-width: 920px) {
  .hero-grid { grid-template-columns: 1fr; gap: 40px; padding-block: 48px 32px; }
}
.display-xl { font-size: clamp(36px, 5.2vw, 64px); line-height: 1.02; letter-spacing: -0.02em; }
.display-lg { font-size: clamp(30px, 3.6vw, 44px); line-height: 1.08; letter-spacing: -0.015em; }
.display-md { font-size: clamp(22px, 2.2vw, 28px); line-height: 1.15; letter-spacing: -0.01em; }
.lede { font-size: clamp(16px, 1.3vw, 18px); color: var(--fg-muted); line-height: 1.65; max-width: 56ch; }

.pill-group { display: inline-flex; gap: 6px; flex-wrap: wrap; }

/* Sample card (landing) */
.sample-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 26px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.sample-card::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse at top right, var(--primary-soft) 0%, transparent 50%);
  opacity: 0.5; pointer-events: none;
}
.sample-card > * { position: relative; }

/* Feature grid */
.feature-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
  padding-block: 40px;
}
@media (max-width: 820px) { .feature-grid { grid-template-columns: 1fr; } }
.feature-num {
  font-family: var(--serif); font-style: italic; font-size: 48px; color: var(--primary);
  line-height: 1; margin-bottom: 10px;
}

/* section spacing */
.section { padding-block: 56px; }
.section-title-row { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }

/* Skill card */
.skill-card {
  display: flex; flex-direction: column; gap: 14px; height: 100%;
  cursor: pointer;
}
.skill-card-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.skill-card-plain {
  font-size: 14px; color: var(--fg); line-height: 1.5;
}
.skill-card-desc {
  font-size: 13px; color: var(--fg-muted); line-height: 1.55;
}
.skill-card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }

.skills-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px;
}

/* Questionnaire layout */
.qnr-shell {
  display: grid; grid-template-columns: 1fr 340px; gap: 40px;
  padding-block: 40px;
}
@media (max-width: 1000px) { .qnr-shell { grid-template-columns: 1fr; } }
.qnr-sidebar {
  position: sticky; top: 84px; align-self: start;
  display: grid; gap: 20px;
}
@media (max-width: 1000px) { .qnr-sidebar { position: static; } }

.question-block { display: grid; gap: 14px; padding-block: 18px; }
.question-block + .question-block { border-top: 1px dashed var(--border); }
.question-title { font-family: var(--serif); font-size: 20px; font-weight: 500; color: var(--fg); }

/* Review */
.rev-skill {
  display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: flex-start;
  padding: 20px; border: 1px solid var(--border); border-radius: var(--radius-lg);
  background: var(--surface); transition: all var(--step);
}
.rev-skill.disabled { opacity: 0.5; }
.rev-skill.manual { border-style: dashed; }
.rev-skill:hover { border-color: var(--border-strong); }

/* File tree */
.file-tree-root { display: grid; gap: 4px; }
.tree-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-family: var(--mono); font-size: 12.5px; color: var(--fg); }
.tree-row .tree-icon { color: var(--fg-muted); }

/* Target tabs big */
.big-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
.big-tab {

// Trigger logic — maps answers to recommended skill ids
function recommendedSkillIds(answers) {
  const rec = new Set();
  const a = answers || {};
  const ksa = a.market === "ksa" || a.market === "gcc";

  if (ksa && a.invoicing) rec.add("zatca-phase2");
  if (ksa && a.pii) rec.add("pdpl-basics");
  if (ksa && a.identity) rec.add("nafath-yakeen-basics");
  if (ksa && a.payments) rec.add("mada-stcpay-basics");

  // Universal
  if (a.secrets && a.secrets !== "manager") rec.add("secrets-baseline");
  if (a.identity || a.pii) rec.add("auth-isolation");
  if (!a.ci) rec.add("ci-hygiene");
  rec.add("testability-check");

  // Order: compliance first, then security, then architecture
  const order = { saudi: 0, security: 1, architecture: 2 };
  return [...rec].sort((x, y) => {
    const sx = SKILLS.find(s => s.id === x);
    const sy = SKILLS.find(s => s.id === y);
    return order[sx.category] - order[sy.category];
  });
}

function Questionnaire({ lang, answers, setAnswers, setRoute }) {
  const t = useT(lang);
  const [step, setStep] = useState(0);
  const [errors, setErrors] = useState({});
  const ksa = answers.market === "ksa" || answers.market === "gcc";

  const steps = [t.q.stepAbout, t.q.stepTech, t.q.stepReview, t.q.stepGenerate];

  function set(key, val) {
    setAnswers(a => ({ ...a, [key]: val }));
    setErrors(e => ({ ...e, [key]: null }));
  }

  function validateStep() {
    const e = {};
    if (step === 0) {
      if (!answers.market) e.market = true;
      if (ksa) {
        if (answers.invoicing == null) e.invoicing = true;
        if (answers.pii == null) e.pii = true;
        if (answers.payments == null) e.payments = true;
        if (answers.identity == null) e.identity = true;
      } else {
        if (answers.pii == null) e.pii = true;
      }
    } else if (step === 1) {
      if (!answers.stack) e.stack = true;
      if (!answers.agents || answers.agents.length === 0) e.agents = true;
      if (answers.ci == null) e.ci = true;
      if (!answers.secrets) e.secrets = true;
    }
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function next() {
    if (!validateStep()) return;
    if (step < 3) setStep(step + 1);
  }
  function prev() {
    if (step === 0) setRoute({ name: "home" });
    else setStep(step - 1);
  }

  return (
    <div className="container-narrow page-enter" style={{ paddingBlock: 32 }}>
      <div style={{ marginBottom: 28 }}>
        <Stepper steps={steps} current={step} lang={lang} />
      </div>

      {step === 0 && <StepAbout t={t} lang={lang} answers={answers} set={set} errors={errors} ksa={ksa}/>}
      {step === 1 && <StepTech t={t} lang={lang} answers={answers} set={set} errors={errors}/>}
      {step === 2 && <StepReview t={t} lang={lang} answers={answers} setAnswers={setAnswers} />}
      {step === 3 && <StepGenerate t={t} lang={lang} answers={answers} />}

      <div style={{ display: "flex", justifyContent: "space-between", gap: 12, marginTop: 40, paddingTop: 24, borderTop: "1px solid var(--border)" }}>
        <Button variant="ghost" onClick={prev} icon={<Icon name="arrowBack" size={14}/>}>{t.prevStep}</Button>
        {step < 3 ? (
          <Button variant="primary" onClick={next} iconEnd={<Icon name="arrow" size={14}/>}>
            {step === 2 ? t.downloadCta : t.nextStep}
          </Button>
        ) : null}
      </div>
    </div>
  );
}

// Review step (recommended + manual) + Generate step with targets and download
function StepReview({ t, lang, answers, setAnswers }) {
  const recIds = useMemo(() => window.recommendedSkillIds(answers), [answers]);
  const [manualOpen, setManualOpen] = useState(false);
  const selected = answers.selected || {};

  // Init selected on first mount for this step
  useEffect(() => {
    if (!answers.selected) {
      const init = {};
      recIds.forEach(id => { init[id] = { on: true, source: "auto" }; });
      setAnswers(a => ({ ...a, selected: init }));
    }
  }, []);

  function toggle(id, source = "auto") {
    setAnswers(a => {
      const cur = a.selected || {};
      const existing = cur[id];
      const next = { ...cur };
      if (existing) {
        next[id] = { ...existing, on: !existing.on };
      } else {
        next[id] = { on: true, source };
      }
      return { ...a, selected: next };
    });
  }

  const activeIds = Object.entries(selected).filter(([, v]) => v.on).map(([k]) => k);
  const nonRec = window.SKILLS.filter(s => !recIds.includes(s.id));

  // Variables needed for active skills
  const varSkills = window.SKILLS.filter(s => activeIds.includes(s.id) && s.variables.length > 0);
  const varVals = answers.varVals || {};
  function setVar(skillId, varId, v) {
    setAnswers(a => ({ ...a, varVals: { ...(a.varVals || {}), [`${skillId}.${varId}`]: v } }));
  }

  return (
    <div>
      <div style={{ marginBottom: 24 }}>
        <div className="eyebrow" style={{ marginBottom: 8 }}>03 / 04</div>
        <h1 className="display-lg" style={{ marginBottom: 10 }}>{t.review.title}</h1>
        <p className="lede">{t.review.lede}</p>
      </div>

      <div style={{ display: "grid", gap: 12 }}>
        {recIds.map(id => {
          const s = window.SKILLS.find(x => x.id === id);
          const on = selected[id]?.on ?? true;
          return <RevSkillRow key={id} skill={s} lang={lang} on={on} onToggle={() => toggle(id, "auto")} sourceLabel={t.review.autoLabel} />;
        })}
        {Object.entries(selected).filter(([id, v]) => v.source === "manual" && v.on).map(([id]) => {
          const s = window.SKILLS.find(x => x.id === id);
          if (!s) return null;
          return <RevSkillRow key={id} skill={s} lang={lang} on manual onToggle={() => toggle(id, "manual")} sourceLabel={t.review.manualLabel} />;
        })}
      </div>

      <div style={{ marginTop: 14 }}>
        <Button variant="ghost" onClick={() => setManualOpen(v => !v)} icon={<Icon name="plus" size={14}/>}>{t.review.addMore}</Button>
      </div>

      {manualOpen && (
        <div className="card card-sunken" style={{ padding: 18, marginTop: 14 }}>
          <div style={{ display: "grid", gap: 10 }}>
            {nonRec.map(s => {
              const on = selected[s.id]?.on ?? false;
              return (
                <CheckCard key={s.id} selected={on} onClick={() => toggle(s.id, "manual")} title={s.name[lang]} desc={s.plain[lang]} />
              );
            })}
          </div>
        </div>
      )}

      {varSkills.length > 0 && (
        <div style={{ marginTop: 40 }}>
          <h2 className="display-md" style={{ marginBottom: 6 }}>{t.review.variables}</h2>
          <p style={{ color: "var(--fg-muted)", fontSize: 14.5, marginBottom: 20 }}>{t.review.variablesLede}</p>
          <div style={{ display: "grid", gap: 14 }}>
            {varSkills.map(s => (
              <div key={s.id} className="card" style={{ padding: 20 }}>
                <div style={{ fontFamily: "var(--serif)", fontSize: 16, marginBottom: 14 }}>{s.name[lang]}</div>
                <div style={{ display: "grid", gap: 14, gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))" }}>
                  {s.variables.map(v => {
                    const key = `${s.id}.${v.id}`;
                    const val = varVals[key] ?? (answers[v.id] ?? "");
                    return (
                      <div key={v.id}>
                        <label className="label">{v.label[lang]}</label>
                        {v.kind === "select" && (
                          <select className="select-input" value={val} onChange={e => setVar(s.id, v.id, e.target.value)}>
                            <option value="">—</option>
                            {v.options.map(o => <option key={o} value={o}>{o}</option>)}
                          </select>
                        )}
                        {v.kind === "boolean" && (
                          <div style={{ display: "flex", gap: 8, alignItems: "center", padding: "8px 0" }}>
                            <Toggle on={!!val} onChange={b => setVar(s.id, v.id, b)} label={v.label[lang]} />
                            <span style={{ fontSize: 13, color: "var(--fg-muted)" }}>{val ? t.q.yes : t.q.no}</span>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function StepGenerate({ t, lang, answers }) {
  const selected = answers.selected || {};
  const agents = answers.agents || ["claude"];
  const [activeAgent, setActiveAgent] = useState(agents[0] || "claude");
  const [dlState, setDlState] = useState("idle"); // idle | working | done
  const activeIds = Object.entries(selected).filter(([, v]) => v.on).map(([k]) => k);

  useEffect(() => {
    if (!agents.includes(activeAgent)) setActiveAgent(agents[0]);
  }, [agents]);

  const agentLabels = {
    claude: "Claude Code",
    cursor: "Cursor",
    codex: "Codex",
    generic: "AGENTS.md",

function FileTree({ agents, filesByAgent }) {
  return (
    <div>
      {agents.map((a, i) => {
        const files = filesByAgent[a] || [];
        const grouped = {};
        files.forEach(f => {
          const parts = f.split("/");
          const dir = parts.slice(0, -1).join("/") || ".";
          grouped[dir] = grouped[dir] || [];
          grouped[dir].push(parts[parts.length - 1]);
        });
        return (
          <div key={a} style={{ marginTop: i === 0 ? 0 : 8, paddingInlineStart: 14 }}>
            {Object.entries(grouped).map(([dir, fs]) => (
              <div key={dir}>
                <div style={{ color: "var(--primary)", fontSize: 11.5 }}>
                  <Icon name="folder" size={11}/> {dir}/
                </div>
                {fs.map(f => (
                  <div key={f} style={{ paddingInlineStart: 14, color: "var(--fg-muted)", fontSize: 11.5 }}>— {f}</div>
                ))}
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}

function Tweaks({ lang, setLang, theme, setTheme, primary, setPrimary, onEdit }) {
  const [open, setOpen] = useState(true);
  const [active, setActive] = useState(false);

  useEffect(() => {
    function onMsg(e) {
      const d = e.data || {};
      if (d.type === "__activate_edit_mode") setActive(true);
      if (d.type === "__deactivate_edit_mode") setActive(false);
    }
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  if (!active) return null;

  const swatches = [
    { id: "default", color: "#8F4B24" },
    { id: "ink", color: "#2E4A6B" },
    { id: "olive", color: "#5C6A36" },
    { id: "slate", color: "#3A3A3A" },
  ];

  return (
    <div className={`tweaks ${open ? "" : "collapsed"}`} dir="ltr">
      <button className="tweaks-header" onClick={() => setOpen(v => !v)} style={{ width: "100%", border: 0, background: "var(--surface-variant)", cursor: "pointer", textAlign: "left" }}>
        <Icon name="sliders" size={14}/>
        <span style={{ flex: 1 }}>Tweaks</span>
        <Icon name={open ? "down" : "chevron"} size={12}/>
      </button>
      {open && (
        <div className="tweaks-body">
          <div className="tweaks-row">
            <span className="tweaks-row-label">Language</span>
            <div className="lang-toggle">
              <button className={lang === "en" ? "active" : ""} onClick={() => { setLang("en"); onEdit({ language: "en" }); }}>EN</button>
              <button className={lang === "ar" ? "active" : ""} onClick={() => { setLang("ar"); onEdit({ language: "ar" }); }}>العربية</button>
            </div>
          </div>
          <div className="tweaks-row">
            <span className="tweaks-row-label">Theme</span>
            <div className="theme-toggle">
              <button className={theme === "light" ? "active" : ""} onClick={() => { setTheme("light"); onEdit({ theme: "light" }); }}><Icon name="sun" size={12}/></button>
              <button className={theme === "dark" ? "active" : ""} onClick={() => { setTheme("dark"); onEdit({ theme: "dark" }); }}><Icon name="moon" size={12}/></button>
            </div>
          </div>
          <div className="tweaks-row">
            <span className="tweaks-row-label">Primary</span>
            <div className="swatch-row">
              {swatches.map(s => (
                <button key={s.id} className={`swatch ${primary === s.id ? "active" : ""}`} style={{ background: s.color }} onClick={() => { setPrimary(s.id); onEdit({ primary: s.id }); }} aria-label={s.id}/>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

window.Tweaks = Tweaks;

        <p style={{ color: "var(--fg-muted)", fontSize: 14, marginBottom: 18 }}>{t.review.lede}</p>
        <div style={{ display: "grid", gap: 10 }}>
          {skills.map(s => <RevSkillRow key={s.id} skill={s} lang={lang} on onToggle={() => {}} sourceLabel={t.review.autoLabel}/>)}
        </div>
      </div>
    );
  }
  if (screen === "generate") {
    return (
      <div>
        <div className="eyebrow" style={{ marginBottom: 8 }}>04 / 04</div>
        <h2 style={{ fontFamily: lang === "ar" ? "Amiri, serif" : "var(--serif)", fontSize: 24, marginBottom: 14, fontWeight: lang === "ar" ? 700 : 500 }}>{t.generate.title}</h2>
        <div className="card" style={{ padding: 16 }}>
          <div className="eyebrow" style={{ marginBottom: 10 }}>{t.generate.zipLabel}</div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 12, lineHeight: 1.9, direction: "ltr", textAlign: "left" }}>
            <div style={{ color: "var(--primary)" }}><Icon name="folder" size={11}/> my-project-skills.zip</div>
            <div style={{ paddingInlineStart: 14 }}>
              <div style={{ color: "var(--primary)" }}>.claude/skills/</div>
              <div style={{ paddingInlineStart: 14, color: "var(--fg-muted)" }}>— zatca-phase2/SKILL.md</div>
              <div style={{ paddingInlineStart: 14, color: "var(--fg-muted)" }}>— pdpl-basics/SKILL.md</div>
              <div style={{ paddingInlineStart: 14, color: "var(--fg-muted)" }}>— secrets-baseline/SKILL.md</div>
              <div style={{ color: "var(--primary)" }}>.cursor/rules/</div>
              <div style={{ paddingInlineStart: 14, color: "var(--fg-muted)" }}>— zatca-phase2.mdc</div>
            </div>
          </div>
          <Button variant="primary" icon={<Icon name="download" size={14}/>} style={{ width: "100%", marginTop: 14, justifyContent: "center" }}>{t.generate.downloadBtn}</Button>
        </div>
      </div>
    );
  }
  if (screen === "detail") {
    const skill = window.SKILLS[0];
    return (
      <div>
        <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
          <Badge variant="primary">{lang === "ar" ? "الامتثال السعودي" : "Saudi compliance"}</Badge>
          <StatusBadge status={skill.status} lang={lang}/>
          <Badge variant="outline"><span style={{ fontFamily: "var(--mono)" }}>v{skill.version}</span></Badge>
        </div>
        <h1 style={{ fontFamily: lang === "ar" ? "Amiri, serif" : "var(--serif)", fontSize: 28, lineHeight: 1.15, marginBottom: 12, fontWeight: lang === "ar" ? 700 : 500 }}>{skill.name[lang]}</h1>
        <p style={{ color: "var(--fg-muted)", fontSize: 14.5, marginBottom: 16 }}>{skill.plain[lang]}</p>
        <Notice variant="warning"><strong>{t.detail.disclaimer}.</strong> {t.detail.disclaimerBody}</Notice>
      </div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);


</script>
</body>
</html>
